name: "SSH Auth"
description: "Forgejo composite action to setup SSH authentication. It creates SSH key ~/.ssh/id_rsa which you can pass to SSH commands."

inputs:
  host-user:
    description: "Destination server username"

  host-ip:
    description: "Destination server host IP address on domain. Example: 233.24.52.14"

  host-key:
    description: "The private SSH key for authorization"

runs:
  using: composite
  steps:
    - name: Create authorization key
      run: |
        echo "⌛ Creating authorization key..."
        mkdir -p ~/.ssh
        echo "${{ inputs.host-key }}" | tee ~/.ssh/id_rsa > /dev/null
        chmod 600 ~/.ssh/id_rsa
        echo "✅ ~/.ssh/id_rsa is created!"

    - name: Authorize host key
      run: |
        echo "⌛ Authorizing host key..."
        ssh-keyscan -H "${{ inputs.host-ip }}" >> ~/.ssh/known_hosts
        echo "✅ Destination host is authorized!"
